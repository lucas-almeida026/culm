[package]
name = "culm"
version = "0.1.0"
edition = "2024"
description = "A terminal application that runs many Claude Code sessions in one project, as vertical tabs."
license = "Unlicense"
repository = "https://github.com/nullenbox/culm"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "user"] }
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-term = "0.3"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
