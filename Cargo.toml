[package]
name = "culm"
version = "0.1.1"
edition = "2024"
description = "A terminal application that opens many projects as tabs, and runs many Claude Code sessions in each."
license = "Unlicense"
repository = "https://github.com/lucas-almeida026/culm"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "user"] }
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.2.0", features = ["inline"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.6"
tui-term = "0.3"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
